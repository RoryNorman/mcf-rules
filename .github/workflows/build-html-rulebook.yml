name: Build HTML rulebook

on:
  push:
    branches: [main, master]
    paths:
      - "rulebook/**"
      - "assets/mcf-logo.png"
      - "scripts/build_rulebook_html.py"
      - ".github/workflows/build-html-rulebook.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build HTML rulebook
        run: python scripts/build_rulebook_html.py

      - name: Upload HTML files
        uses: actions/upload-artifact@v4
        with:
          name: mcf-html-rulebook
          path: output/html/**
          if-no-files-found: error
          retention-days: 90

      - name: Check out website repository
        uses: actions/checkout@v4
        with:
          repository: RoryNorman/mcf
          ref: main
          path: destination
          ssh-key: ${{ secrets.WORDPRESS_REPO_SSH_KEY }}

      - name: Copy WordPress rulebook
        run: |
          mkdir -p destination/content
          cp output/html/mcf-rulebook-wordpress.html \
            destination/content/mcf-rulebook.html

      - name: Commit and push website update
        working-directory: destination
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- content/mcf-rulebook.html

          if git diff --cached --quiet; then
            echo "WordPress rulebook is already current."
            exit 0
          fi

          git commit -m "Update MCF WordPress rulebook"
          git push origin main
