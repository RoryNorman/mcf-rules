name: Build HTML rulebook

on:
  push:
    branches: [main, master]
    paths:
      - "rulebook/**"
      - "scripts/build_rulebook_html.py"
      - ".github/workflows/build-html-rulebook.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build HTML rulebook
        run: python scripts/build_rulebook_html.py

      - name: Upload HTML files
        uses: actions/upload-artifact@v4
        with:
          name: mcf-html-rulebook
          path: output/html/*.html
          if-no-files-found: error
          retention-days: 90
